<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Payment Methods</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

  <!-- External CSS -->
  <link rel="stylesheet" href="styles.css">
  <style>
    .topbar .back {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--white);
      border: 1px solid var(--divider);
      border-radius: 12px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .topbar .back:hover {
      background: var(--panel);
      border-color: var(--teal-600);
    }

    .topbar .back svg {
      width: 20px;
      height: 20px;
      stroke: var(--dark);
    }
  </style>
</head>

<body>
  <div class="page">

    <header class="app-header">
      <div class="header-logo">Dolaby</div>

    <nav class="header-nav">
      <a href="homepage.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="aboutus.html">About</a>
    </nav>

      <div class="header-icons">
        <svg class="header-icon-btn" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.4" />
          <circle cx="11" cy="11" r="6.2" stroke="currentColor" stroke-width="1.4" />
        </svg>

        <svg class="header-icon-btn" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M12 20s-6-4.35-8.2-7.2C1.7 9.9 4 6 8 6c1.9 0 3 1.3 4 2.4 1-1.1 2.1-2.4 4-2.4 4 0 6.3 3.9 4.2 6.8C18 15.6 12 20 12 20z"
            stroke="currentColor" stroke-width="1.2" />
        </svg>

<a href="cart.html" class="cart-icon header-icon-btn">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4H6zM3 6h18M16 10a4 4 0 0 1-8 0"
      stroke="currentColor" stroke-width="1.2" />
  </svg>
  <div class="cart-badge">3</div>
</a>
        <div class="background">
          <a href="menu.html">
            <button class="menu__icon" aria-label="Open menu">
              <span></span>
              <span></span>
              <span></span>
            </button>
          </a>
        </div>

      </div>
    </header>


    <!-- TOPBAR -->
    <div class="topbar">
      <div class="container">
        <div class="top-left">
          <a class="back" href="checkout.html" aria-label="Back">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M15 18L9 12l6-6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </a>
          <div class="title">Payment Methods</div>
        </div>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="page-inner">
      <main class="pm-main" role="main">
        <section class="pm-list" aria-label="Payment methods">

          <!-- Add another card -->
          <div class="pm-row pm-add" onclick="window.location.href='addanothercard.html'">
            <div class="pm-row-left">
              <span class="pm-add-icon">＋</span>
              <span class="pm-add-text">Add another Card</span>
            </div>
            <span class="pm-arrow" aria-hidden="true"><i class="fa-solid fa-chevron-right"></i></span>
          </div>

          <!-- VISA card -->
          <div class="pm-row">
            <div class="pm-row-left">
              <span class="card-logo card-logo-visa">VISA</span>
              <span class="card-number">•••• 7601</span>
            </div>
            <span class="pm-arrow" aria-hidden="true"><i class="fa-solid fa-chevron-right"></i></span>
          </div>

          <!-- MasterCard -->
          <div class="pm-row">
            <div class="pm-row-left">
              <span class="card-logo card-logo-mastercard">
                <span class="mc-circles" aria-hidden="true">
                  <span class="mc-circle red"></span>
                  <span class="mc-circle orange"></span>
                </span>
              </span>
              <span class="card-number">•••• 4800</span>
            </div>
            <span class="pm-arrow" aria-hidden="true"><i class="fa-solid fa-chevron-right"></i></span>
          </div>

        </section>
      </main>
    </div>
  </div>
</body>
</html>
