<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add Another Card</title>

  <!-- Your main project stylesheet -->
  <link rel="stylesheet" href="styles.css">
  <!-- Optional: if this page is used standalone and you want its styles isolated,
       load the payment-page CSS separately:
  <link rel="stylesheet" href="payment-page.css">
  -->
  <style>
    .topbar .back {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--white);
      border: 1px solid var(--divider);
      border-radius: 12px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .topbar .back:hover {
      background: var(--panel);
      border-color: var(--teal-600);
    }

    .topbar .back svg {
      width: 20px;
      height: 20px;
      stroke: var(--dark);
    }
  </style>
</head>

<body>
  <header class="app-header">
    <div class="header-logo">Dolaby</div>

    <nav class="header-nav">
      <a href="homepage.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="aboutus.html">About</a>
    </nav>
    <div class="header-icons">
      <svg class="header-icon-btn" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.4" />
        <circle cx="11" cy="11" r="6.2" stroke="currentColor" stroke-width="1.4" />
      </svg>

      <svg class="header-icon-btn" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path
          d="M12 20s-6-4.35-8.2-7.2C1.7 9.9 4 6 8 6c1.9 0 3 1.3 4 2.4 1-1.1 2.1-2.4 4-2.4 4 0 6.3 3.9 4.2 6.8C18 15.6 12 20 12 20z"
          stroke="currentColor" stroke-width="1.2" />
      </svg>

      <a href="cart.html" class="cart-icon header-icon-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4H6zM3 6h18M16 10a4 4 0 0 1-8 0"
            stroke="currentColor" stroke-width="1.2" />
        </svg>
        <div class="cart-badge">3</div>
      </a>

      <div class="background">
        <a href="menu.html">
          <button class="menu__icon">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </a>
      </div>

    </div>
  </header>

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="container">
      <div class="top-left">
        <a class="back" href="paymentmethod.html" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M15 18L9 12l6-6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>
        <div class="title">Add New Card</div>
      </div>
    </div>
  </div>

  <!-- Wrapper to scope styles and avoid conflicts with global classes -->
  <div class="payment-page">
    <div class="container">
      <!-- Main Heading -->
      <h1 class="main-heading">Enter your card information</h1>

      <!-- Card Number -->
      <div class="input-wrapper">
        <input type="text" inputmode="numeric" pattern="[0-9\s]{13,19}" autocomplete="cc-number"
          placeholder="Card Number" aria-label="Card Number">
        <div class="input-icon" aria-hidden="true">💳</div>
      </div>

      <!-- Expiry Date + CVV Row -->
      <div class="row">
        <div class="col input-wrapper">
          <input type="text" placeholder="Expiry date (MM/YY)" autocomplete="cc-exp" inputmode="numeric"
            aria-label="Expiry date">
        </div>
        <div class="col input-wrapper">
          <input type="text" placeholder="CVV" autocomplete="cc-csc" inputmode="numeric" maxlength="4" aria-label="CVV">
          <div class="input-icon" aria-hidden="true">🔒</div>
        </div>
      </div>

      <!-- Cardholder Name -->
      <div class="input-wrapper">
        <input type="text" placeholder="Cardholder Name" autocomplete="cc-name" aria-label="Cardholder name">
      </div>

      <!-- Card Label (optional) -->
      <div class="input-wrapper">
        <input type="text" placeholder="Card Label (optional)" aria-label="Card label (optional)">
      </div>

      <!-- Add Button -->
      <button class="add-button" type="button" aria-label="Add card">Add</button>
    </div>
  </div>

</body>

</html>
